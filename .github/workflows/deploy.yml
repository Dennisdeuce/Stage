name: Deploy (Cloudflare Pages)

on:
  push:
    # The repo's default branch is claude/upbeat-darwin-3z46gs (no `main`
    # exists); "main" is kept for a future rename.
    branches: ["main", "claude/upbeat-darwin-3z46gs"]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Per-event/venue HTML stubs + sitemap from the live inventory (skips
      # itself gracefully if the env or fetch is unavailable) — SPRINT §1.2.
      - name: Prerender event & venue pages + sitemap
        run: npm run prerender
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pnw-stage
